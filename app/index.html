<!DOCTYPE html>
<html lang="en" class="app">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Chess Tactics Trainer</title>

<meta name="description" content="Blunder Rush, 3D tactics, visualization and board-vision exercises. Works offline.">
<meta name="theme-color" content="#0b0f14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tactics">
<meta name="format-detection" content="telephone=no">

<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="../img/icon-180.png">
<link rel="icon" href="../img/favicon.ico" sizes="any">

<link rel="stylesheet" href="./css/tokens.css">
<link rel="stylesheet" href="./css/app.css">

<!-- three.js resolves offline out of app/vendor/three/. No CDN, no build step. -->
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/three.module.min.js"
  }
}
</script>

<script>
/* Theme before first paint. Without this the app flashes the light palette on
   a dark-themed phone every single launch. Mirrors settings.js exactly. */
(function () {
  try {
    var s = JSON.parse(localStorage.getItem('tt.settings.v1') || 'null');
    if (s && (s.theme === 'light' || s.theme === 'dark')) {
      document.documentElement.setAttribute('data-theme', s.theme);
    }
  } catch (e) { /* defaults are fine */ }
})();
</script>

<style>
  /* Shell glue only — three rules that app.css has no reason to carry.
     Everything else on every screen comes from tokens.css + app.css. */

  /* The settings sheet is the one sheet that can outgrow a short phone.
     The cap goes on a plain wrapper, NOT on `.setting-list` itself: that list
     is `display:grid` with its own `overflow:hidden`, so capping it directly
     both loses the scroll and compresses every row to its min-height, which
     makes tall rows overlap their neighbours. */
  .sheet [data-role="settings-scroll"] { max-height: min(56dvh, 520px); }

  /* Screens are inserted before the toast layer, which is absolutely
     positioned; keep it out of the shell's single grid cell. */
  .app-shell > .toast-layer { grid-area: stack; align-self: end; }
</style>
</head>

<body class="app">

<!-- ===================== ICON SPRITE (inline, offline) =====================
     Shared by the shell and by every mode: `<svg><use href="#i-check"/></svg>`.
     Inline rather than an external file so it is available on the very first
     paint and can never 404 offline. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">

    <path d="M12 3l7 3v5c0 4.5-3 8.3-7 10-4-1.7-7-5.5-7-10V6z"/><path d="M9 12l2 2 4-4"/>
  </symbol>

    <path d="M12 4L2.5 20h19z"/><path d="M12 10v4"/><path d="M12 17.5h.01"/>
  </symbol>
  <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4.5 12.5l5 5 10-11"/>
  </symbol>
  <symbol id="i-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">

  </symbol>
  <symbol id="i-timer" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

  </symbol>
  <symbol id="i-bolt" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

  </symbol>
  <symbol id="i-heart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 20s-7-4.4-7-9.5A3.9 3.9 0 0112 8a3.9 3.9 0 017 2.5c0 5.1-7 9.5-7 9.5z"/>
  </symbol>
  <symbol id="i-target" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.5"/>
  </symbol>
  <symbol id="i-puzzle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

  </symbol>

    <path d="M6.3 6.5A15 15 0 003 11s3.5 6 9 6a9.3 9.3 0 004.2-1"/><path d="M9.9 9.9a3 3 0 004.2 4.2"/>
  </symbol>

    <path d="M9 5l7 7-7 7"/>
  </symbol>

  </symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

  </symbol>
  <symbol id="i-gear" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="3"/>
    <path d="M12 3l1.3 2.3 2.6-.4.5 2.6 2.3 1.2-1.2 2.3 1.2 2.3-2.3 1.2-.5 2.6-2.6-.4L12 21l-1.3-2.3-2.6.4-.5-2.6-2.3-1.2L6.5 13 5.3 10.7l2.3-1.2.5-2.6 2.6.4z"/>

  </symbol>
  <symbol id="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2 12h2M20 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/>
  </symbol>
  <symbol id="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20 14.5A8.5 8.5 0 019.5 4 8.5 8.5 0 1020 14.5z"/>
  </symbol>
  <symbol id="i-chart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 20V4"/><path d="M4 20h16"/><path d="M8 16v-4"/><path d="M13 16V8"/><path d="M18 16v-6"/>
  </symbol>
  <symbol id="i-arrow-up" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

  </symbol>
  <!-- Leave the run: a door with the arrow pointing OUT of it, leftwards, the
       direction every other "go back" affordance in this app points. -->
  <symbol id="i-exit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14 4h4a2 2 0 012 2v12a2 2 0 01-2 2h-4"/><path d="M9 8l-4 4 4 4"/><path d="M5 12h10"/>
  </symbol>
</svg>

<!-- The whole app lives in this one fixed, non-scrolling shell. -->
<div class="app-shell" id="app">
  <div class="loading">
    <div class="spinner" role="status" aria-label="Loading"></div>
    <h1 class="loading__title">Tactics Trainer</h1>
    <p class="loading__status">Starting up&hellip;</p>
  </div>
</div>

<noscript>
  <p style="padding:2rem;font:16px system-ui">This trainer needs JavaScript.</p>
</noscript>

<script type="module" src="./js/app.js"></script>
</body>
</html>
